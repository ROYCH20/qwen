name: Deploy to Yandex Cloud Object Storage

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_VK_APP_URL: ${{ secrets.VK_APP_URL }}
          VITE_DEMO_ACCESS: ${{ secrets.DEMO_ACCESS }}
        run: npm run build
      
      - name: Configure AWS CLI for Yandex S3
        run: |
          pip install awscli
          mkdir -p ~/.aws
          cat > ~/.aws/config <<EOF
[default]
region = ru-central1
endpoint_url = https://storage.yandexcloud.net
EOF
          cat > ~/.aws/credentials <<EOF
[default]
aws_access_key_id = ${YC_ACCESS_KEY_ID}
aws_secret_access_key = ${YC_SECRET_ACCESS_KEY}
EOF
        env:
          YC_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          YC_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
      
      - name: Sync dist to Yandex Bucket
        run: |
          aws s3 sync ./dist s3://${{ secrets.YC_BUCKET }} \
            --delete \
            --no-progress \
            --exclude ".git/*"
