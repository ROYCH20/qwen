name: Deploy to Yandex Cloud Object Storage

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_VK_APP_URL: ${{ secrets.VK_APP_URL }}
          VITE_DEMO_ACCESS: ${{ secrets.DEMO_ACCESS }}
        run: npm run build

      # Шаг 1: Загружаем файлы
      - name: Sync dist to Yandex Bucket
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --delete
        env:
          AWS_S3_ENDPOINT: https://storage.yandexcloud.net
          AWS_S3_REGION: ru-central1
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET: ${{ secrets.YC_BUCKET }}
          SOURCE_DIR: './dist'

      # Шаг 2: Явно открываем доступ ко всем файлам (Fix for 403/404 errors)
      - name: Set Public Read Access recursively
        run: |
          pip install awscli
          export AWS_ACCESS_KEY_ID=${{ secrets.YC_ACCESS_KEY_ID }}
          export AWS_SECRET_ACCESS_KEY=${{ secrets.YC_SECRET_ACCESS_KEY }}
          export AWS_DEFAULT_REGION=ru-central1
          
          echo "Setting public-read ACL for all objects in bucket..."
          aws s3api list-objects-v2 \
            --bucket ${{ secrets.YC_BUCKET }} \
            --endpoint-url https://storage.yandexcloud.net \
            --query "Contents[].Key" \
            --output text | xargs -I {} sh -c 'echo "Publicizing: {}"; aws s3api put-object-acl --bucket ${{ secrets.YC_BUCKET }} --key "{}" --acl public-read --endpoint-url https://storage.yandexcloud.net'
