name: Deploy to Yandex Cloud Object Storage

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_VK_APP_URL: ${{ secrets.VK_APP_URL }}
          VITE_DEMO_ACCESS: ${{ secrets.DEMO_ACCESS }}
        run: npm run build
      
      - name: Sync dist to Yandex Bucket
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --delete
        env:
          AWS_S3_ENDPOINT: https://storage.yandexcloud.net
          AWS_S3_REGION: ru-central1
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET: ${{ secrets.YC_BUCKET }}
          SOURCE_DIR: ./dist
