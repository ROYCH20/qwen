name: Deploy to Yandex Cloud Object Storage

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_VK_APP_URL: ${{ secrets.VK_APP_URL }}
          VITE_DEMO_ACCESS: ${{ secrets.DEMO_ACCESS }}
        run: npm run build

      # Используем стандартный aws-cli для максимальной надежности
      - name: Configure AWS Credentials for Yandex
        run: |
          mkdir -p ~/.aws
          echo "[default]" > ~/.aws/config
          echo "region = ru-central1" >> ~/.aws/config
          echo "endpoint_url = https://storage.yandexcloud.net" >> ~/.aws/config
          
          echo "[default]" > ~/.aws/credentials
          echo "aws_access_key_id = ${YC_ACCESS_KEY_ID}" >> ~/.aws/credentials
          echo "aws_secret_access_key = ${YC_SECRET_ACCESS_KEY}" >> ~/.aws/credentials
        env:
          YC_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          YC_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}

      - name: Sync dist folder to Bucket
        run: |
          echo "Starting sync..."
          aws s3 sync ./dist s3://${{ secrets.YC_BUCKET }} \
            --delete \
            --no-progress \
            --exclude ".git/*" \
            --acl public-read
