<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#120F38" />
    <meta name="description" content="Веб-сервис посвящения первокурсников - учет активности и рейтинга групп" />
    <title>Посвящение 2026</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link href="https://fonts.cdnfonts.com/css/grafmassa" rel="stylesheet">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden; /* v17.6-mobile-fix-v2: документ не скроллится */
        overscroll-behavior: none; /* нет pull-to-refresh/bounce */
      }
      body {
        font-family: 'Grafmassa', sans-serif;
        /* v17.6-mobile-fix-v2: фирменный градиент рисует #root (background,
           position:relative); fixed-слой .bg-layer удален — он отрывается
           на iOS при инерции скролла. Здесь только базовый цвет до
           монтирования React / под прозрачными слоями. */
        background: #120F38;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
